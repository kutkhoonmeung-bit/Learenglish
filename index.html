
<!doctype html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ເກມປະກອບສະຫຼະ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+Lao:wght@400;600;700&display=swap">
<style>
html { scroll-behavior: smooth; }

/* Layout: one column "moveable alphabet" mat. Montessori colour code: consonants blue, vowels red. */
:root{
  --bg:#EDF2F6;
  --surface:#FFFFFF;
  --ink:#16212C;
  --muted:#586877;
  --line:#CBD6DF;
  --slot:#DDE6ED;
  --cons:#2D68D8;
  --vowel:#D6304A;
  --tile-ink:#FFFFFF;
  --good:#17804F;
  --good-bg:#DDF1E7;
  --bad:#B53626;
  --bad-bg:#F9E1DC;
  --note-bg:#E4EAF8;
  --font-tile:'Andika','Noto Sans Lao',system-ui,sans-serif;
  --font-ui:'Noto Sans Lao','Andika',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B;--surface:#19222B;--ink:#E8EEF3;--muted:#98A8B6;--line:#2B3845;--slot:#25303B;
    --cons:#3E78E6;--vowel:#E04A62;--good:#4CC992;--good-bg:#17342A;--bad:#F27B6A;--bad-bg:#3A201C;--note-bg:#1F2A3D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B;--surface:#19222B;--ink:#E8EEF3;--muted:#98A8B6;--line:#2B3845;--slot:#25303B;
  --cons:#3E78E6;--vowel:#E04A62;--good:#4CC992;--good-bg:#17342A;--bad:#F27B6A;--bad-bg:#3A201C;--note-bg:#1F2A3D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-block:76px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.site-menu{position:fixed;top:0;left:0;right:0;z-index:10;height:57px;background:#19232d;border-bottom:1px solid #303b46;padding:0 max(16px,env(safe-area-inset-left,0px))}
.site-menu nav{height:100%;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap}
.site-menu a{color:#e8eef3;text-decoration:none;font-size:.9rem;font-weight:700;padding:8px 4px;border-radius:6px}
.site-menu a:hover,.site-menu a:focus-visible,.site-menu a[aria-current="page"]{color:#fff;background:#2b3845;outline:none}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0;max-width:100%}
.pbar{max-width:100%}
h1{font-size:1.6rem;line-height:1.25;margin:0;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.tabs{display:flex;gap:6px;background:var(--slot);padding:5px;border-radius:12px}
.tabs button{font-size:.92rem;flex:1;border:0;background:transparent;padding:9px 6px;border-radius:8px;font-weight:600;min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lbl{font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* tiles */
.t{
  font-family:var(--font-tile);font-weight:700;color:var(--tile-ink);border:0;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,.28);user-select:none;
}
.t.c{background:var(--cons)}
.t.v{background:var(--vowel)}
.t.sm{min-width:46px;height:46px;padding:0 10px;font-size:1.25rem}
.t.sm:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.t.sm.used{outline:3px solid var(--ink);outline-offset:1px}
.t.sm[disabled]{opacity:.45;cursor:default}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.poolgap{width:100%;height:0}

/* pattern bar */
.pbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:thin}
.pchip{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;min-width:64px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2}
.pchip b{font-family:var(--font-tile);font-size:1.15rem;color:var(--vowel)}
.pchip small{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip[aria-pressed="true"]{border-color:var(--vowel);background:var(--note-bg)}

.pinfo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.biglabel{display:flex;gap:4px;align-items:center}
.biglabel .t{width:58px;height:66px;font-size:2.2rem}
.biglabel .gap{width:24px;height:66px;border-radius:8px;border:2px dashed var(--vowel);opacity:.7}
.pinfo .txt{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.snd{font-size:1.15rem;font-weight:700}
.ipa{font-family:var(--font-tile);color:var(--muted);font-weight:400;margin-left:6px}
.tip{color:var(--muted);font-size:.92rem;margin:0}

/* board */
.board{display:flex;justify-content:center;gap:6px;align-items:flex-start;padding:14px 8px 10px;background:var(--bg);border-radius:12px;flex-wrap:nowrap}
.sl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.sl small{font-size:.75rem;color:var(--muted);font-weight:600}
.slot,.fixed{width:70px;height:78px;font-size:2.1rem;border-radius:10px}
.slot{border:2px dashed var(--muted);background:var(--slot);color:var(--tile-ink);font-family:var(--font-tile);font-weight:700;display:flex;align-items:center;justify-content:center}
.slot.filled{border:0;background:var(--cons);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.slot.vowelslot.filled{background:var(--vowel)}
.slot.wide{width:84px}
.fixed{font-family:var(--font-tile)}
.wordline{font-family:var(--font-tile);font-size:1.6rem;font-weight:700;text-align:center;letter-spacing:.06em;min-height:2.2rem}

.msg{border-radius:10px;padding:10px 12px;background:var(--note-bg);font-size:.98rem;min-height:3.2rem;display:flex;align-items:center;gap:10px}
.msg.good{background:var(--good-bg);color:var(--good)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg .w{font-family:var(--font-tile);font-weight:700}
.msg b{font-weight:700}
.msg .em{font-size:2.2rem;line-height:1}
.board.revealed{outline:3px solid var(--good);outline-offset:0}
.picbox{width:92px;height:92px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:3.6rem;line-height:1;flex:0 0 auto}

.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}

/* found list */
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:8px;background:var(--slot);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.rime{display:flex;flex-direction:column;gap:6px}
.rime h3{margin:0;font-size:.9rem;color:var(--muted);font-family:var(--font-tile);display:flex;gap:8px;align-items:baseline}
.rime h3 span{font-size:.75rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-tile);font-weight:700;border-radius:8px;padding:3px 10px;font-size:1.05rem;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.chip.on{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.chip.off{border-style:dashed;color:var(--muted);font-weight:400;cursor:default}
.chip small{font-family:var(--font-ui);font-weight:400;color:var(--muted);margin-left:6px;font-size:.8rem}

/* quiz */
.clue{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.emoji{font-size:3rem;line-height:1;min-width:56px;text-align:center}
.gloss{font-size:1.3rem;font-weight:700}
.qmeta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ok{outline:3px solid var(--good);outline-offset:1px}
.no{outline:3px solid var(--bad);outline-offset:1px}
.score{font-size:3rem;font-weight:700;font-family:var(--font-tile);line-height:1.1}

/* library */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .t{min-width:56px;height:44px;padding:0 10px;font-size:1.3rem}
summary .s{flex:1;min-width:0}
summary .s b{display:block}
summary .s span{font-size:.85rem;color:var(--muted)}
details .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.hidden-note{font-size:.85rem;color:var(--muted);margin:0}
.seg{display:flex;gap:6px;background:var(--slot);padding:4px;border-radius:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:7px;font-weight:600;min-width:0;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
select,input.wi{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input.wi{font-family:var(--font-tile);font-size:1.6rem;font-weight:700;letter-spacing:.08em;text-align:center}
input.wi:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.showw{font-family:var(--font-tile);font-weight:700;font-size:2.2rem;letter-spacing:.12em;text-align:center;color:var(--cons);min-height:3rem}
.lt{font-family:var(--font-tile);font-weight:700;font-size:1.8rem;letter-spacing:.08em}
.lt.g{color:var(--good)}.lt.r{color:var(--bad)}
.wstat{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}.bar i{transition:none}}
@media (max-width:420px){
  .slot,.fixed{width:58px;height:70px;font-size:1.8rem}
  .slot.wide{width:70px}
  .board{gap:4px;padding-inline:4px}
}
</style>

 </head>

<div class="wrap">

    <p class="sub">ຕົວຕັ້ງ + ສະຫຼະ + ໂຕປະກອບ = ຄຳສັບ. ພະຍັນຊະນະສີຟ້າ, ສະຫຼະສີແດງ.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="ໂໝດເກມ">
    <button role="tab" id="tab-build" aria-selected="true" aria-controls="v-build">ສ້າງຄຳ</button>
    <button role="tab" id="tab-quiz" aria-selected="false" aria-controls="v-quiz">ເກມທົດສອບ</button>
    <button role="tab" id="tab-write" aria-selected="false" aria-controls="v-write">ຝຶກຂຽນ</button>
    <button role="tab" id="tab-lib" aria-selected="false" aria-controls="v-lib">ຄັງສະຫຼະ</button>
  </div>

  <!-- BUILD -->
  <section id="v-build" role="tabpanel" aria-labelledby="tab-build" class="wrap" style="gap:14px">
    <div class="pbar" id="pbar" role="group" aria-label="ເລືອກສະຫຼະ"></div>
    <div class="card">
      <div class="pinfo" id="pinfo"></div>
      <div class="board" id="board"></div>
      <div class="wordline" id="wordline" aria-live="polite"></div>
      <div class="msg" id="bmsg" aria-live="polite">ແຕະຕົວຕັ້ງ ແລະ ໂຕປະກອບ ເພື່ອສ້າງຄຳ.</div>
      <div class="row">
        <button class="btn" id="bHear" disabled>ຟັງສຽງ</button>
        <button class="btn ghost" id="bClear">ລ້າງ</button>
        <button class="btn ghost" id="bHint">ໃບ້ຄຳ</button>
      </div>
    </div>
    <div class="card">
      <div class="lbl">ຕົວຕັ້ງ (ພະຍັນຊະນະຕົ້ນຄຳ)</div>
      <div class="pool" id="poolO"></div>
      <div id="finalWrap" style="display:flex;flex-direction:column;gap:14px">
        <div class="lbl">ໂຕປະກອບ (ພະຍັນຊະນະທ້າຍ)</div>
        <div class="pool" id="poolF"></div>
      </div>
    </div>
    <div class="card">
      <div class="fhead"><div class="lbl">ຄຳທີ່ພົບ</div><div class="count" id="fcount"></div></div>
      <div class="bar"><i id="fbar"></i></div>
      <div id="found" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="v-quiz" role="tabpanel" aria-labelledby="tab-quiz" class="wrap" hidden></section>

  <!-- WRITE -->
  <section id="v-write" role="tabpanel" aria-labelledby="tab-write" class="wrap" hidden></section>

  <!-- LIBRARY -->
  <section id="v-lib" role="tabpanel" aria-labelledby="tab-lib" class="wrap" hidden style="gap:10px"></section>
</div>

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function mk(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function say(t,rate){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate||0.8;speechSynthesis.speak(u);}catch(e){}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function rime(tpl,f){return compose(tpl,"",f);}
function show(sel,on){var e=$(sel);if(e)e.hidden=!on;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function labelHTML(p){
  if(p.tpl.indexOf("_")>=0){var a=p.tpl.split("_");return '<span class="t v">'+a[0]+'</span><span class="gap"></span><span class="t v">'+a[1]+'</span>';}
  return '<span class="t v" style="width:auto;min-width:58px;padding:0 12px">'+esc(p.label)+'</span>';
}

/* ---------- tabs ---------- */
var tabs=["build","quiz","write","lib"];
function setTab(name){
  tabs.forEach(function(n){
    var b=$("#tab-"+n); b.setAttribute("aria-selected",n===name?"true":"false");
    $("#v-"+n).hidden=(n!==name);
  });
  if(name==="quiz") quizRender();
  if(name==="write") wrRender();
  if(name==="lib") libRender();
}
tabs.forEach(function(n){ $("#tab-"+n).addEventListener("click",function(){setTab(n);}); });

  link.addEventListener("click",function(ev){
    ev.preventDefault();
    var name=link.getAttribute("data-game-tab");
    setTab(name);
    $("#tab-"+name).focus();
    $(".tabs").scrollIntoView({behavior:"smooth",block:"start"});
  });
});

/* ---------- BUILD ---------- */
var found=new Set(load("phonics.found.v1",[]));
var B={pat:"i_e",o:null,f:null};

function foundCount(p){var n=0;p.words.forEach(function(x){if(found.has(p.id+":"+x.w))n++;});return n;}

function buildPbar(){
  var bar=$("#pbar"); bar.innerHTML="";
  PATS.forEach(function(p){
    var b=mk("button","pchip",'<b>'+esc(p.label)+'</b><small>'+foundCount(p)+'/'+p.words.length+'</small>');
    b.setAttribute("aria-pressed",p.id===B.pat?"true":"false");
    b.addEventListener("click",function(){B.pat=p.id;B.o=null;B.f=p.noFinal?"":null;buildAll();});
    bar.appendChild(b);
  });
}
function buildInfo(){
  var p=BYID[B.pat], box=$("#pinfo"); box.innerHTML="";
  var bl=mk("div","biglabel",labelHTML(p)); box.appendChild(bl);
  var ex=p.words[0];
  var txt=mk("div","txt",'<div class="snd">ອອກສຽງ '+esc(p.lao)+'<span class="ipa">'+esc(p.ipa)+'</span></div><p class="tip">'+esc(p.tip)+'</p>');
  box.appendChild(txt);
}
function slotBtn(kind,val,label,wide){
  var wrap=mk("div","sl");
  var b=mk("button","slot"+(wide?" wide":"")+(val!==null?" filled":""),val===null?"":(val===""?"–":esc(val)));
  b.setAttribute("aria-label",label+(val!==null?": "+(val===""?"ບໍ່ມີ":val):": ຍັງວ່າງ"));
  b.addEventListener("click",function(){ if(kind==="o")B.o=null; else B.f=null; buildBoard(); buildPools(); buildEval(false); });
  wrap.appendChild(b); wrap.appendChild(mk("small",null,label));
  return wrap;
}
function fixedTile(txt,label){
  var wrap=mk("div","sl");
  wrap.appendChild(mk("div","t v fixed",esc(txt)));
  wrap.appendChild(mk("small",null,label));
  return wrap;
}
function buildBoard(){
  var p=BYID[B.pat], bd=$("#board"); bd.innerHTML="";
  bd.appendChild(slotBtn("o",B.o,"ຕົວຕັ້ງ",false));
  if(p.tpl.indexOf("_")>=0){
    var a=p.tpl.split("_");
    bd.appendChild(fixedTile(a[0],"ສະຫຼະ"));
    if(!p.noFinal) bd.appendChild(slotBtn("f",B.f,"ໂຕປະກອບ",true));
    bd.appendChild(fixedTile(a[1],"e ມະຫັດ"));
  } else {
    var big=p.tpl.length>2;
    var v=fixedTile(p.tpl,"ສະຫຼະ");
    if(big){ var t=v.firstChild; t.style.width="auto"; t.style.minWidth="70px"; t.style.padding="0 10px"; t.style.fontSize=p.tpl.length>3?"1.5rem":"1.9rem"; }
    bd.appendChild(v);
    if(!p.noFinal) bd.appendChild(slotBtn("f",B.f,"ໂຕປະກອບ",true));
  }
  show("#finalWrap",!p.noFinal);
}
function buildPools(){
  var p=BYID[B.pat];
  var po=$("#poolO"); po.innerHTML="";
  ONSETS.forEach(function(o,i){
    if(i===19) po.appendChild(mk("div","poolgap"));
    var b=mk("button","t c sm"+(B.o===o?" used":""),esc(o));
    b.addEventListener("click",function(){B.o=o;buildBoard();buildPools();buildEval(true);});
    po.appendChild(b);
  });
  var noOn=mk("button","t c sm"+(B.o===""?" used":""),"–");
  noOn.setAttribute("aria-label","ບໍ່ມີຕົວຕັ້ງ");
  noOn.addEventListener("click",function(){B.o="";buildBoard();buildPools();buildEval(true);});
  po.appendChild(noOn);
  var pf=$("#poolF"); pf.innerHTML="";
  if(p.noFinal) return;
  FINALS.forEach(function(f,i){
    if(i===16) pf.appendChild(mk("div","poolgap"));
    var b=mk("button","t c sm"+(B.f===f?" used":""),esc(f));
    b.addEventListener("click",function(){B.f=f;buildBoard();buildPools();buildEval(true);});
    pf.appendChild(b);
  });
  var noF=mk("button","t c sm"+(B.f===""?" used":""),"–");
  noF.setAttribute("aria-label","ບໍ່ມີໂຕປະກອບ");
  noF.addEventListener("click",function(){B.f="";buildBoard();buildPools();buildEval(true);});
  pf.appendChild(noF);
}
function setMsg(cls,html){var m=$("#bmsg");m.className="msg"+(cls?" "+cls:"");m.innerHTML=html;}
var lastWord="";
function buildEval(speak){
  var p=BYID[B.pat], wl=$("#wordline");
  var ready=(B.o!==null)&&(p.noFinal||B.f!==null);
  $("#bHear").disabled=!ready;
  if(!ready){
    lastWord=""; wl.textContent="";
    setMsg("","ແຕະຕົວຕັ້ງ"+(p.noFinal?"":" ແລະ ໂຕປະກອບ")+" ເພື່ອສ້າງຄຳ.");
    return;
  }
  var w=compose(p.tpl,B.o,p.noFinal?"":B.f);
  lastWord=w; wl.textContent=w;
  var real=null; p.words.forEach(function(x){if(x.w===w)real=x;});
  if(real){
    var key=p.id+":"+w, isNew=!found.has(key);
    var clue=(real.emoji?'<span class="em">'+real.emoji+'</span> ':"")+esc(real.gloss);
    if(isNew){found.add(key);store("phonics.found.v1",Array.from(found));}
    setMsg("good",(isNew?"<b>ພົບຄຳໃໝ່!</b> ":"<b>ເຈົ້າພົບຄຳນີ້ແລ້ວ.</b> ")+'<span class="w">'+esc(w)+'</span> ແປວ່າ '+(clue||"(ຄຳນີ້)"));
    if(isNew){wl.classList.remove("pop");void wl.offsetWidth;wl.classList.add("pop");}
    buildPbar(); buildFound();
  } else if(GLOBAL[w] && GLOBAL[w]!==p.id){
    var other=BYID[GLOBAL[w]];
    setMsg("bad",'<span class="w">'+esc(w)+'</span> ເປັນຄຳແທ້ ແຕ່ຢູ່ໃນກຸ່ມສະຫຼະ <b>'+esc(other.label)+'</b>, ບໍ່ແມ່ນ '+esc(p.label)+'.');
  } else {
    setMsg("",'<span class="w">'+esc(w)+'</span> ອ່ານອອກສຽງໄດ້ ແຕ່ຍັງບໍ່ຢູ່ໃນລາຍການຄຳຂອງເກມ (ອາດເປັນຄຳທຽມ). ລອງໃສ່ຕົວອື່ນ.');
  }
  if(speak) say(w);
}
function buildFound(){
  var p=BYID[B.pat], box=$("#found"); box.innerHTML="";
  var groups={}, order=[];
  p.words.forEach(function(x){var r=rime(p.tpl,x.f); if(!groups[r]){groups[r]=[];order.push(r);} groups[r].push(x);});
  var n=foundCount(p), tot=p.words.length;
  $("#fcount").textContent=n+" / "+tot;
  $("#fbar").style.width=Math.round(n/tot*100)+"%";
  order.forEach(function(r){
    var list=groups[r], got=list.filter(function(x){return found.has(p.id+":"+x.w);}).length;
    var g=mk("div","rime",'<h3>-'+esc(r)+' <span>'+got+'/'+list.length+'</span></h3>');
    var ch=mk("div","chips");
    list.forEach(function(x){
      if(found.has(p.id+":"+x.w)){
        var c=mk("button","chip on",(x.emoji?x.emoji+" ":"")+esc(x.w)+(x.gloss?'<small>'+esc(x.gloss)+'</small>':""));
        c.addEventListener("click",function(){say(x.w);});
        ch.appendChild(c);
      } else {
        ch.appendChild(mk("span","chip off","＿"+esc(r)));
      }
    });
    g.appendChild(ch); box.appendChild(g);
  });
}
function buildAll(){buildPbar();buildInfo();buildBoard();buildPools();buildEval(false);buildFound();}

$("#bHear").addEventListener("click",function(){if(lastWord)say(lastWord);});
$("#bClear").addEventListener("click",function(){var p=BYID[B.pat];B.o=null;B.f=p.noFinal?"":null;buildBoard();buildPools();buildEval(false);});
$("#bHint").addEventListener("click",function(){
  var p=BYID[B.pat];
  var rest=p.words.filter(function(x){return !found.has(p.id+":"+x.w);});
  if(!rest.length){setMsg("good","<b>ເກັ່ງຫຼາຍ!</b> ເຈົ້າພົບຄົບທຸກຄຳໃນກຸ່ມນີ້ແລ້ວ. ລອງກຸ່ມສະຫຼະອື່ນ.");return;}
  var x=rest[Math.floor(Math.random()*rest.length)];
  var clue=((x.emoji?x.emoji+" ":"")+x.gloss).trim();
  setMsg("","<b>ໃບ້:</b> "+esc(clue)+" ("+x.w.length+" ໂຕອັກສອນ, ລົງທ້າຍດ້ວຍ -"+esc(rime(p.tpl,x.f))+")");
});

/* ---------- QUIZ ---------- */
var Q={list:[],i:0,score:0,streak:0,pick:{o:null,v:null,f:null},done:false,state:"start"};
var QPOOL=[];
PATS.forEach(function(p){p.words.forEach(function(x){if(x.gloss||x.emoji)QPOOL.push(x);});});
function quizBest(){return load("phonics.best.v1",0);}
function quizRender(){
  var root=$("#v-quiz"); root.innerHTML="";
  if(Q.state==="start"){
    var c=mk("div","card");
    c.innerHTML='<h2 style="margin:0;font-size:1.25rem">ທົດສອບ 10 ຂໍ້</h2><p class="tip" style="margin:0">ເບິ່ງຄຳໃບ້ ແລະ ຟັງສຽງ ແລ້ວເລືອກ <b>ຕົວຕັ້ງ</b>, <b>ສະຫຼະ</b> ແລະ <b>ໂຕປະກອບ</b> ໃຫ້ຄົບ. ຕົວຢ່າງ: ຫ້າ = f + i_e + v = five.</p><p class="tip" style="margin:0">ຄະແນນສູງສຸດຂອງເຈົ້າ: <b>'+quizBest()+'</b> / 100</p>';
    var b=mk("button","btn","ເລີ່ມເກມ"); b.style.alignSelf="flex-start";
    b.addEventListener("click",quizStart); c.appendChild(b); root.appendChild(c); return;
  }
  if(Q.state==="end"){
    var best=quizBest(); if(Q.score>best){best=Q.score;store("phonics.best.v1",best);}
    var msg=Q.score>=90?"ຍອດເຢັ່ຽມ!":Q.score>=60?"ເກັ່ງຫຼາຍ!":"ສູ້ຕໍ່ໄປ, ລອງອີກຄັ້ງ!";
    var c2=mk("div","card");
    c2.innerHTML='<div class="lbl">ຄະແນນຂອງເຈົ້າ</div><div class="score">'+Q.score+' <span style="font-size:1.2rem;color:var(--muted)">/ 100</span></div><p style="margin:0;font-weight:700">'+msg+'</p><p class="tip" style="margin:0">ຄະແນນສູງສຸດ: '+best+'</p>';
    var r=mk("button","btn","ຫຼິ້ນອີກຄັ້ງ"); r.style.alignSelf="flex-start"; r.addEventListener("click",quizStart);
    c2.appendChild(r); root.appendChild(c2); return;
  }
  var x=Q.list[Q.i], p=BYID[x.pat];
  var card=mk("div","card");
  card.appendChild(mk("div","qmeta",'<span>ຂໍ້ '+(Q.i+1)+' / '+Q.list.length+'</span><span>ຄະແນນ '+Q.score+(Q.streak>1?' · ຖືກຕິດກັນ '+Q.streak:'')+'</span>'));
  var clue=mk("div","clue");
  clue.appendChild(mk("div","picbox",x.emoji||"❓"));
  var ct=mk("div",null,'<div class="gloss">'+esc(x.gloss||"ຟັງສຽງ ແລ້ວສະກົດຄຳ")+'</div>');
  var hb=mk("button","btn ghost","ຟັງສຽງ"); hb.style.marginTop="6px"; hb.addEventListener("click",function(){say(x.w);});
  ct.appendChild(hb); clue.appendChild(ct); card.appendChild(clue);

  var board=mk("div","board"); board.id="qboard"; card.appendChild(board);
  var wl=mk("div","wordline"); wl.id="qword"; card.appendChild(wl);
  var res=mk("div","msg","ເລືອກຕົວຕັ້ງ, ສະຫຼະ ແລະ "+(p.noFinal?"ກົດກວດຄຳຕອບ.":"ໂຕປະກອບ.")); res.id="qmsg"; res.setAttribute("aria-live","polite"); card.appendChild(res);
  root.appendChild(card);

  var tiles=mk("div","card");
  Q.opts={
    o:shuffle([x.o].concat(shuffle(ONSETS.filter(function(o){return o!==x.o;})).slice(0,5))),
    v:null,
    f:shuffle([x.f].concat(shuffle(FINALS.filter(function(f){return f!==x.f;})).slice(0,5)))
  };
  var vs=[p]; var pool=shuffle(PATS.filter(function(q){return q.label!==p.label;}));
  var seen={}; seen[p.label]=1;
  pool.forEach(function(q){ if(vs.length<4 && !seen[q.label]){seen[q.label]=1;vs.push(q);} });
  Q.opts.v=shuffle(vs);
  var tg=function(title,key,color,list,fmt){
    var g=mk("div",null); g.style.cssText="display:flex;flex-direction:column;gap:8px";
    g.appendChild(mk("div","lbl",title));
    var row=mk("div","pool"); row.id="qp-"+key;
    list.forEach(function(val){
      var txt=fmt(val);
      var b=mk("button","t "+color+" sm",esc(txt));
      b.dataset.key=key; b.dataset.val=(key==="v"?val.id:val);
      b.addEventListener("click",function(){quizPick(key,key==="v"?val.id:val);});
      row.appendChild(b);
    });
    g.appendChild(row); tiles.appendChild(g);
  };
  tg("ຕົວຕັ້ງ","o","c",Q.opts.o,function(v){return v===""?"–":v;});
  tg("ສະຫຼະ","v","v",Q.opts.v,function(v){return v.label;});
  if(!p.noFinal) tg("ໂຕປະກອບ","f","c",Q.opts.f,function(v){return v===""?"–":v;});
  var act=mk("div","row"); act.id="qact";
  var chk=mk("button","btn","ກວດຄຳຕອບ"); chk.id="qcheck"; chk.disabled=true; chk.addEventListener("click",quizCheck);
  act.appendChild(chk); tiles.appendChild(act);
  root.appendChild(tiles);
  Q.pick={o:null,v:null,f:p.noFinal?"":null}; Q.done=false;
  quizBoard();
}
function quizStart(){
  Q.list=shuffle(QPOOL).slice(0,10); Q.i=0; Q.score=0; Q.streak=0; Q.state="play";
  quizRender();
  say(Q.list[0].w);
}
function quizPick(key,val){
  if(Q.done) return;
  Q.pick[key]=val;
  var btns=document.querySelectorAll("#qp-"+key+" .t");
  Array.prototype.forEach.call(btns,function(b){ b.classList.toggle("used",b.dataset.val===String(val)); });
  quizBoard();
}
function quizBoard(){
  var x=Q.list[Q.i], p=BYID[x.pat], bd=$("#qboard"); bd.innerHTML="";
  var vp=Q.pick.v?BYID[Q.pick.v]:null;
  function slot(val,label,cls,wide){
    var w=mk("div","sl");
    var s=mk("div","slot"+(val!==null?" filled":"")+(cls?" "+cls:"")+(wide?" wide":""),val===null?"":(val===""?"–":esc(val)));
    if(val!==null && val.length>2) s.style.fontSize="1.4rem";
    w.appendChild(s); w.appendChild(mk("small",null,label)); return w;
  }
  bd.appendChild(slot(Q.pick.o,"ຕົວຕັ້ງ",""));
  bd.appendChild(slot(vp?vp.label:null,"ສະຫຼະ","vowelslot",true));
  if(!p.noFinal) bd.appendChild(slot(Q.pick.f,"ໂຕປະກອບ","",false));
  var ready=Q.pick.o!==null && Q.pick.v!==null && Q.pick.f!==null;
  var chk=$("#qcheck"); if(chk) chk.disabled=!ready||Q.done;
  bd.classList.toggle("revealed",Q.done);
  var wl=$("#qword");
  if(wl) wl.textContent=(Q.pick.o!==null&&vp&&Q.pick.f!==null)?compose(vp.tpl,Q.pick.o,Q.pick.f):"";
}
function quizCheck(){
  if(Q.done) return;
  var x=Q.list[Q.i], p=BYID[x.pat];
  var okO=Q.pick.o===x.o, okV=BYID[Q.pick.v].label===p.label, okF=Q.pick.f===x.f;
  var all=okO&&okV&&okF; Q.done=true;
  function mark(key,ok,correctVal){
    Array.prototype.forEach.call(document.querySelectorAll("#qp-"+key+" .t"),function(b){
      b.disabled=true;
      if(b.classList.contains("used")) b.classList.add(ok?"ok":"no");
      if(!ok && b.dataset.val===String(correctVal)) b.classList.add("ok");
    });
  }
  mark("o",okO,x.o); mark("v",okV,p.id); if(!p.noFinal) mark("f",okF,x.f);
  var msg=$("#qmsg");
  if(!all){ Q.pick={o:x.o,v:p.id,f:x.f}; quizBoard(); }
  if(all){
    Q.streak++; Q.score+=10;
    msg.className="msg good"; msg.innerHTML='<b>ຖືກຕ້ອງ!</b> <span class="w">'+esc(x.w)+'</span> = '+esc(x.o||"–")+' + '+esc(p.label)+(p.noFinal?"":' + '+esc(x.f||"–"));
  } else {
    Q.streak=0;
    var bad=[]; if(!okO)bad.push("ຕົວຕັ້ງ"); if(!okV)bad.push("ສະຫຼະ"); if(!okF&&!p.noFinal)bad.push("ໂຕປະກອບ");
    msg.className="msg bad"; msg.innerHTML='ຜິດທີ່: '+bad.join(", ")+'. ຄຳຕອບ: <span class="w">'+esc(x.w)+'</span> = '+esc(x.o||"–")+' + '+esc(p.label)+(p.noFinal?"":' + '+esc(x.f||"–"));
  }
  say(x.w);
  var act=$("#qact"); act.innerHTML="";
  var last=(Q.i===Q.list.length-1);
  var nx=mk("button","btn",last?"ເບິ່ງຄະແນນ":"ຂໍ້ຕໍ່ໄປ");
  nx.addEventListener("click",function(){
    if(last){Q.state="end";quizRender();}
    else{Q.i++;quizRender();say(Q.list[Q.i].w);}
  });
  act.appendChild(nx);
  var hr=mk("button","btn ghost","ຟັງອີກ"); hr.addEventListener("click",function(){say(x.w);}); act.appendChild(hr);
  document.querySelector(".qmeta span:last-child").textContent="ຄະແນນ "+Q.score+(Q.streak>1?" · ຖືກຕິດກັນ "+Q.streak:"");
}

/* ---------- LIBRARY ---------- */
var libDone=false;
function libRender(){
  if(libDone) return; libDone=true;
  var root=$("#v-lib");
  root.appendChild(mk("p","hidden-note","ແຕະຊື່ສະຫຼະເພື່ອເປີດ, ແຕະຄຳເພື່ອຟັງສຽງ."));
  PATS.forEach(function(p){
    var d=document.createElement("details");
    var sm=document.createElement("summary");
    var tile=mk("span","t v",esc(p.label));
    sm.appendChild(tile);
    sm.appendChild(mk("span","s",'<b>ອອກສຽງ '+esc(p.lao)+' <span style="font-family:var(--font-tile)">'+esc(p.ipa)+'</span></b><span>'+p.words.length+' ຄຳ</span>'));
    d.appendChild(sm);
    var inn=mk("div","in");
    inn.appendChild(mk("p","tip",esc(p.tip)));
    var groups={},order=[];
    p.words.forEach(function(x){var r=rime(p.tpl,x.f); if(!groups[r]){groups[r]=[];order.push(r);} groups[r].push(x);});
    order.forEach(function(r){
      var g=mk("div","rime",'<h3>-'+esc(r)+'</h3>'), ch=mk("div","chips");
      groups[r].forEach(function(x){
        var c=mk("button","chip",(x.emoji?x.emoji+" ":"")+esc(x.w)+(x.gloss?'<small>'+esc(x.gloss)+'</small>':""));
        c.addEventListener("click",function(){say(x.w);});
        ch.appendChild(c);
      });
      g.appendChild(ch); inn.appendChild(g);
    });
    d.appendChild(inn); root.appendChild(d);
  });
}


/* ---------- WRITE (typing practice) ---------- */
var Wr={mode:"copy",pat:"all",list:[],i:0,hint:1,done:false,ok:0,tried:0,built:false};
function wrNewList(){
  var a=[];
  if(Wr.pat==="vocab"){
    a=VOCAB_WORDS.map(function(w){return {w:w,gloss:"",emoji:"",pat:"vocab"};});
  } else {
    PATS.forEach(function(p){ if(Wr.pat==="all"||Wr.pat===p.id) p.words.forEach(function(x){a.push(x);}); });
  }
  Wr.list=shuffle(a); Wr.i=0;
}
function wrRender(){
  var root=$("#v-write");
  if(Wr.built) return; Wr.built=true;
  wrNewList();
  var c=mk("div","card");
  c.appendChild(mk("div","lbl","ເລືອກວິທີຝຶກ"));
  var seg=mk("div","seg"); seg.setAttribute("role","group");
  var b1=mk("button",null,"ເບິ່ງແລ້ວຄັດລອກ"), b2=mk("button",null,"ຟັງແລ້ວຂຽນເອງ");
  seg.appendChild(b1); seg.appendChild(b2); c.appendChild(seg);
  function sync(){b1.setAttribute("aria-pressed",Wr.mode==="copy");b2.setAttribute("aria-pressed",Wr.mode==="own");}
  b1.addEventListener("click",function(){Wr.mode="copy";sync();wrQ(false);});
  b2.addEventListener("click",function(){Wr.mode="own";Wr.hint=1;sync();wrQ(false);});
  sync();
  var sel=document.createElement("select"); sel.id="wrSel"; sel.setAttribute("aria-label","ເລືອກຊຸດຄຳຝຶກ");
  var o0=document.createElement("option"); o0.value="all"; o0.textContent="ທຸກກຸ່ມສະຫຼະ (ປະສົມ)"; sel.appendChild(o0);
  var ov=document.createElement("option"); ov.value="vocab"; ov.textContent="ຄຳສັບແຫຼ່ງເປີດ 3,000 ຄຳ"; sel.appendChild(ov);
  PATS.forEach(function(p){var o=document.createElement("option");o.value=p.id;o.textContent="ສະຫຼະ "+p.label+" ("+p.words.length+" ຄຳ)";sel.appendChild(o);});
  sel.addEventListener("change",function(){Wr.pat=sel.value;$("#wrCredit").hidden=Wr.pat!=="vocab";wrNewList();wrQ(false);});
  c.appendChild(sel);
  c.appendChild(mk("p","tip","ໂໝດຄັດລອກຈະສະແດງຄຳ; ໂໝດຝຶກຈະໃຫ້ຟັງສຽງແລ້ວຂຽນເອງ. ຊຸດຄຳພື້ນຖານມີຄຳແປລາວ, ສ່ວນຊຸດ 3,000 ຄຳເນັ້ນການຝຶກຟັງ ແລະ ສະກົດ."));
  c.appendChild(mk("p","hidden-note",'<span id="wrCredit" hidden>3,000 ຄຳນີ້ຈັດຕາມຄວາມຖີ່ໃນ OpenSubtitles 2018 ຈາກ <a href="https://github.com/hermitdave/FrequencyWords" target="_blank" rel="noopener noreferrer">FrequencyWords</a> ໂດຍ Hermit Dave ແລະດັດແປງບາງສ່ວນ; ເນື້ອຫາໃຊ້ສິດ <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>. ຊຸດນີ້ບໍ່ແມ່ນ Oxford 3000 ແລະບໍ່ໄດ້ຈັດລະດັບຕາມ CEFR.</span>'));
  root.appendChild(c);
  var q=mk("div","card"); q.id="wrQ"; root.appendChild(q);
  wrQ(false);
}
function wrQ(focus){
  var q=$("#wrQ"); q.innerHTML="";
  if(Wr.i>=Wr.list.length){ wrNewList(); }
  var x=Wr.list[Wr.i], p=BYID[x.pat]; Wr.done=false; Wr.hint=1;
  q.appendChild(mk("div","wstat",'ຄຳ '+(Wr.i+1)+' / '+Wr.list.length+' · ຂຽນຖືກ '+Wr.ok+' / '+Wr.tried+(p?' · ກຸ່ມສະຫຼະ '+esc(p.label):' · ຄຳສັບ')));
  var clue=mk("div","clue");
  clue.appendChild(mk("div","picbox",x.emoji||"❓"));
  var prompt=x.gloss||(x.pat==="vocab"?"ຟັງສຽງແລ້ວຝຶກສະກົດຄຳ":"");
  var ct=mk("div",null,'<div class="gloss">'+esc(prompt)+'</div>');
  var hb=mk("button","btn ghost","ຟັງສຽງ"); hb.style.marginTop="6px"; hb.addEventListener("click",function(){say(x.w);});
  ct.appendChild(hb); clue.appendChild(ct); q.appendChild(clue);
  var show=mk("div","showw"); show.id="wrShow"; show.setAttribute("aria-live","polite"); q.appendChild(show);
  var inp=document.createElement("input"); inp.type="text"; inp.id="wrIn"; inp.className="wi";
  inp.setAttribute("autocapitalize","off"); inp.setAttribute("autocomplete","off"); inp.setAttribute("autocorrect","off");
  inp.setAttribute("spellcheck","false"); inp.setAttribute("lang","en"); inp.setAttribute("aria-label","ຂຽນຄຳອັງກິດ"); inp.placeholder=Wr.mode==="own"&&x.pat==="vocab"?"ພິມຄຳທີ່ໄດ້ຍິນ":"ພິມຄຳນີ້ຢູ່ນີ້";
  q.appendChild(inp);
  var res=mk("div","msg","ພິມຄຳອັງກິດ ແລ້ວກົດ ກວດ."); res.id="wrMsg"; res.setAttribute("aria-live","polite"); q.appendChild(res);
  var act=mk("div","row"); act.id="wrAct"; q.appendChild(act);
  function acts(){
    act.innerHTML="";
    if(!Wr.done){
      var ck=mk("button","btn","ກວດ"); ck.addEventListener("click",wrCheck); act.appendChild(ck);
      if(Wr.mode==="own"){var hh=mk("button","btn ghost","ໃບ້ຕົວອັກສອນ"); hh.addEventListener("click",function(){Wr.hint=Math.min(x.w.length,Wr.hint+1);wrShow();}); act.appendChild(hh);}
      var sk=mk("button","btn ghost","ຂ້າມ"); sk.addEventListener("click",function(){Wr.i++;wrQ(true);}); act.appendChild(sk);
    } else {
      var nx=mk("button","btn","ຄຳຕໍ່ໄປ"); nx.addEventListener("click",function(){Wr.i++;wrQ(true);}); act.appendChild(nx);
      var rt=mk("button","btn ghost","ລອງຂຽນໃໝ່"); rt.addEventListener("click",function(){wrQ(true);}); act.appendChild(rt);
    }
  }
  Wr.acts=acts;
  function wrShow(){
    var e=$("#wrShow"); if(!e) return;
    if(Wr.done||Wr.mode==="copy"){ e.textContent=x.w; }
    else { var t=x.w.slice(0,Wr.hint).split("").join(" "); for(var k=Wr.hint;k<x.w.length;k++) t+=" _"; e.textContent=t; }
  }
  Wr.showFn=wrShow; Wr.cur=x;
  inp.addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ev.preventDefault(); if(Wr.done){Wr.i++;wrQ(true);} else wrCheck();} });
  wrShow(); acts();
  say(x.w);
  if(focus) { try{inp.focus();}catch(e){} }
}
function wrCheck(){
  if(Wr.done) return;
  var x=Wr.cur, inp=$("#wrIn"), got=inp.value.trim().toLowerCase(), ans=x.w.toLowerCase();
  if(!got){ var m0=$("#wrMsg"); m0.className="msg"; m0.textContent="ຍັງບໍ່ໄດ້ພິມ. ພິມຄຳກ່ອນ ແລ້ວກົດ ກວດ."; return; }
  Wr.tried++; Wr.done=true; inp.disabled=true;
  var m=$("#wrMsg");
  if(got===ans){
    Wr.ok++;
    m.className="msg good"; m.innerHTML='<span class="em">🎉</span> <span><b>ຖືກຕ້ອງ!</b> <span class="w">'+esc(x.w)+'</span>'+(x.gloss?' ແປວ່າ '+esc(x.gloss):"")+'</span>';
  } else {
    var h=""; var n=Math.max(got.length,ans.length);
    for(var i=0;i<got.length;i++){ h+='<span class="lt '+(got[i]===ans[i]?"g":"r")+'">'+esc(got[i])+'</span>'; }
    var bad=[]; for(var j=0;j<n;j++){ if(got[j]!==ans[j]) bad.push(j+1); }
    var why=got.length<ans.length?"ຂາດຕົວອັກສອນ":(got.length>ans.length?"ມີຕົວອັກສອນເກີນ":"ຕົວອັກສອນບໍ່ຕົງ");
    m.className="msg bad"; m.style.flexDirection="column"; m.style.alignItems="flex-start";
    m.innerHTML='<div>ເຈົ້າພິມ: '+h+'</div><div>ຄຳທີ່ຖືກ: <span class="lt g">'+esc(x.w)+'</span></div><div>'+why+' (ຕຳແໜ່ງທີ່ຜິດ: '+bad.join(", ")+'). ເບິ່ງຄຳທີ່ຖືກແລ້ວລອງຂຽນໃໝ່.</div>';
  }
  Wr.showFn(); Wr.acts(); say(x.w);
  var st=$("#wrQ .wstat"); if(st) st.textContent='ຄຳ '+(Wr.i+1)+' / '+Wr.list.length+' · ຂຽນຖືກ '+Wr.ok+' / '+Wr.tried+(x.pat==="vocab"?' · ຄຳສັບ':' · ກຸ່ມສະຫຼະ '+esc(BYID[x.pat].label));
}

buildAll();
})();
</script>
